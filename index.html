<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mosaic & Slip Chart Editor</title>
        <link rel="stylesheet" href="./grid.css">
        <script src="./grid.js"></script>
    </head>
    <body>
        <h1>Demo for: (nxn) scaling</h1>
        <div class="button-menu">
            <div class="input-lable">
                <p>n =</p>
                <input type="number" id="x-cells" value="10">
            </div>
            <button id="chart-change" style="font-size: 15px;">Apply n (clears grid)</button>
        </div>
        <br>
        <div class="grid" id="chart"></div>
        <br>
        <div class="button-menu">
            <button id="markers">Markers</button>
            <button id="mosaic">Mosaic</button>
            <button id="slip">Slip</button>
        </div>
    </body>
</html>
